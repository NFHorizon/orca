server {
    listen 80;
    listen [::]:80;
    server_name 36.249.184.200;

    location ^~ /.well-known/acme-challenge/ {
        root /volume1/orca-relay/source/deploy/ugreen-relay/acme-webroot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 307 http://$host:9999$request_uri;
    }
}
