name: orca-ugreen-relay

services:
  data-init:
    image: node:24-alpine
    user: "0:0"
    command: ["chown", "1000:1000", "/data/relay"]
    volumes:
      - relay-data:/data/relay
    restart: "no"

  relay:
    image: orca-ugreen-relay:1.4.224
    build:
      context: ../../cloud
      dockerfile: apps/relay/Dockerfile
    environment:
      PORT: "8080"
      ORCA_RELAY_ROLE: combined
      ORCA_RELAY_CELL_ID: ugreen
      ORCA_RELAY_PUBLIC_URL: https://36.249.184.200:8443
      ORCA_RELAY_CELL_URL: https://36.249.184.200:8443
      ORCA_RELAY_AUTH_ISSUER: https://login.onorca.dev
      ORCA_RELAY_JWKS_URL: https://login.onorca.dev/.well-known/jwks.json
      ORCA_RELAY_ASSIGNMENT_SIGNING_KEY: ${ORCA_RELAY_ASSIGNMENT_SIGNING_KEY:?Run ./start.sh or configure .env first}
      ORCA_RELAY_ADMIN_AUDIENCE: https://36.249.184.200:8443
      ORCA_RELAY_DEPLOY_SERVICE_ACCOUNT: disabled@ugreen.invalid
      ORCA_RELAY_REGIONAL_PLACEMENT_ENABLED: "false"
      ORCA_RELAY_DATA_DIR: /data/relay
    volumes:
      - relay-data:/data/relay
    depends_on:
      data-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  tls:
    image: nginx:alpine
    ports:
      - "8443:8443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./letsencrypt:/etc/letsencrypt:ro
    depends_on:
      relay:
        condition: service_healthy
    restart: unless-stopped

volumes:
  relay-data:
